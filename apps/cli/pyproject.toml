[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-cli"
dynamic = ["version"]
description = "GHOST: GitHub, Handoff, Operations, Search, and Tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1",
    "rich>=13.9,<15",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
ghost = "ghost_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ghost_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
